# Tether-Optimize peer watchlist
#
# Addresses listed here get PF guard rules on every apply. The file ships empty
# so a fresh install blocks nothing but the overlay/loopback guards; add only
# hosts you actually want isolated on your own network.
#
# Format (whitespace separated, '#' starts a comment):
#
#   <address-or-cidr>   [in|out|both]   [all|tcp|udp|icmp]   [syn]
#
#   in    — drop traffic arriving from the host
#   out   — drop traffic sent to the host
#   both  — drop in both directions (the default), grouped into one PF set
#   syn   — for 'tcp' only: match just the connection-opening SYN
#
# Examples
#   192.0.2.50                  # both directions, every protocol
#   192.0.2.60   in    udp      # only inbound UDP
#   192.0.2.61   in    tcp  syn # only inbound connection attempts
#   192.0.2.62   out   all
#   fe80::1c82:e0c:4108:d78e      # IPv6 works with the same syntax
#
# Inspect the result with:  tether-optimize watchlist
