name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Shell syntax
        run: |
          bash -n bin/tether-optimize
          bash -n scripts/install.sh
          bash -n scripts/build-release.sh

      - name: Python and JS syntax
        run: |
          python3 -m py_compile web/serve.py
          node --check web/static/app.js

      - name: Unit tests (parsers, snapshot, watchlist, no-personal-data guard)
        run: python3 -m unittest discover -s tests -v

      - name: Workbench endpoints
        run: |
          python3 web/serve.py --port 7189 --root web >/tmp/workbench.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:7189/api/health" >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          for path in / /static/app.css /static/app.js /api/snapshot /api/theorems /api/history /api/rules; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "http://127.0.0.1:7189${path}")
            echo "${path} ${code}"
            test "${code}" = "200"
          done

      - name: Install Lean 4.35.0 toolchain
        timeout-minutes: 10
        run: |
          if command -v lean >/dev/null 2>&1; then
            echo "lean already present: $(lean --version)"
          else
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi

      - name: Lean 4 proofs (110 theorems, 0 axioms)
        timeout-minutes: 10
        run: |
          out=$(lean --run proofs/TetherOptimizeSpec.lean)
          echo "$out" | tail -25
          echo "$out" | grep -q "kernel-verified"
